[tool.poetry]
name = "parsecore"
version = "1.0.1"
description = "Python library for osu! beatmap parsing, mod handling, and performance point calculation."
authors = [
    "Error44 <error44@olib.dev>",
    "DevilPedrow <devilpedrow@olib.dev>",
]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/O-Lib/parsecore"
repository = "https://github.com/O-Lib/parsecore"
documentation = "https://github.com/O-Lib/parsecore#readme"
keywords = ["osu", "beatmap", "parser", "mods", "performance", "pp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
packages = [{ include = "parsecore" }]

[tool.poetry.dependencies]
python = "^3.10"
requests = "*"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
mypy = ">=1.0"
ruff = ">=0.9"
pre-commit = ">=3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PYI"]
ignore = [
    "E501",   # line length is handled by the formatter, not enforced here
    "PYI034", # `Self` return hints require typing.Self, unavailable on Python 3.10
    "B904",   # wrapped parse errors already embed the original cause in their message
]

[tool.ruff.lint.per-file-ignores]
# The package adds its own directory to sys.path before importing submodules.
"parsecore/Beatmap/__init__.py" = ["E402"]
# `_patches` is imported for its import-time side effects (it binds cross-type
# helper methods onto the mod classes), so it is deliberately "unused".
"parsecore/Mods/__init__.py" = ["F401"]
# These modules bind extra methods onto their own classes via a deferred
# self-import at the end of the file, which trips the import/redefinition rules.
"parsecore/Mods/game_mods.py" = ["E402", "F811"]
"parsecore/Mods/_patches.py" = ["E402"]
# The reworked Aim skill intentionally supersedes the legacy definition kept
# earlier in the file for reference.
"parsecore/Performance/rulesets/osu/skills.py" = ["F811"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=parsecore --cov-report=term-missing"

[tool.coverage.run]
source = ["parsecore"]
omit = ["tests/*"]
